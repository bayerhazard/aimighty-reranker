olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimrerqwen3vllm: 1

metadata:
  name: aimrerqwen3vllm
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-reranker/main/icon.png
  description: Qwen3-Reranker-0.6B via vLLM — native /v1/rerank (Jina/Cohere compatible)
  appid: aimrerqwen3vllm
  title: AIM Qwen3 0.6B Reranker
  version: '26.9.1'
  categories:
    - AI

entrances:
  - name: aimrerqwen3vllm
    port: 8080
    host: aimrerqwen3vllm
    title: AIM Qwen3 0.6B Reranker
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-reranker/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.9.1'
  upgradeDescription: |
    Initial Release for AImighty Olares One
  fullDescription: |
    Aimighty Reranker deploys Qwen3-Reranker-0.6B using vLLM on NVIDIA RTX 5090 (Blackwell).

    **Features**
    - /v1/rerank endpoint (native vLLM, Jina/Cohere compatible)
    - Live monitoring dashboard on port 8080
    - vLLM v0.26.0-cu129 (pinned, immutable)
    - Prometheus metrics via /metrics
    - Optimized: 4 GB GPU, 12 GB RAM
    - 2 containers only (vLLM + dashboard); no proxy sidecar

    **Resource Usage**
    GPU: 4 GB VRAM (NVIDIA RTX 5090 or compatible)
    RAM: 12 GB
    Disk: 10 GB

  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-reranker
  sourceCode: https://github.com/bayerhazard/aimighty-reranker
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: "1"
  limitedCpu: "4"
  requiredMemory: 4Gi
  limitedMemory: 12Gi
  requiredDisk: 10Gi
  requiredGpu: 1

permission:
  appData: true

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
