olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimrerqwen3vllm: 1

metadata:
  name: aimrerqwen3vllm
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-reranker/main/icon.png
  description: Qwen3-Reranker-0.6B via vLLM with Qwen3 instruction template proxy (Jina/Cohere compatible)
  appid: aimrerqwen3vllm
  title: AIM Qwen3 0.6B Reranker
  version: '26.9.6'
  categories:
    - AI

entrances:
  - name: aimrerqwen3vllm
    port: 8080
    host: aimrerqwen3vllm
    title: AIM Qwen3 0.6B Reranker
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-reranker/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.9.6'
  upgradeDescription: |
    v26.9.6: Same fix as v26.9.5, with the proxy values hardcoded in the templates (values-freeze workaround).
    v26.9.5: Fix rerank quality — a stdlib-only template-proxy sidecar now wraps query/documents in the Qwen3-Reranker instruction prompt before calling vLLM /rerank. vLLM 0.29 implements no score template for Qwen3ForSequenceClassification, so raw input returned miscalibrated scores (0.30 relevant / 0.12 irrelevant instead of 0.9997 / 0.0001) and RAGFlow's hybrid blend demoted relevant chunks. Verified: rec@1 with rerank now beats no-rerank. nginx routes /v1/rerank to the proxy; /v1/models, /v1/score and /metrics stay on vLLM.
    v26.9.4: GPU resources hardcoded in the template (dodges the Olares values-freeze on upgrade) - HAMi memory slice 4 GiB.
    v26.9.3: HAMi memory-slice pinned to 4 GiB (nvidia.com/gpumem) and the CUDA soft cap aligned to 4096m so the RTX 5090 on olares-worker can host OmniVoice TTS, Qwen3-ASR, PaddleOCR and the Qwen3 Reranker co-resident. Built for Olares 1.12.6.
    v26.9.2: vLLM v0.26.0 -> v0.29.0 (Model Runner V2 default, ~2-3x faster rerank, benchmarked).
    v26.9.1: Initial Release for AImighty Olares One
  fullDescription: |
    Aimighty Reranker deploys Qwen3-Reranker-0.6B using vLLM on NVIDIA RTX 5090 (Blackwell).

    **Features**
    - /v1/rerank endpoint (Jina/Cohere compatible, Qwen3 prompt applied by the proxy)
    - Live monitoring dashboard on port 8080
    - vLLM v0.29.0-cu129 (pinned, immutable)
    - Prometheus metrics via /metrics
    - Optimized: 4 GB GPU, 12 GB RAM
    - 3 containers: vLLM + dashboard + Qwen3 template proxy (stdlib, no extra GPU/RAM)

    **Resource Usage**
    GPU: 4 GiB HAMi memory slice (NVIDIA RTX 5090, co-resident with OmniVoice TTS, Qwen3-ASR and PaddleOCR)
    RAM: 12 GB
    Disk: 10 GB

  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-reranker
  sourceCode: https://github.com/bayerhazard/aimighty-reranker
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: "1"
  limitedCpu: "4"
  requiredMemory: 4Gi
  limitedMemory: 12Gi
  requiredDisk: 10Gi
  requiredGpu: 1

permission:
  appData: true

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
